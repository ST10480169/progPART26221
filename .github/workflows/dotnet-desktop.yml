name: Build GraceAI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore GraceAI.csproj

    - name: Build application
      run: dotnet build GraceAI.csproj --configuration ${{ matrix.configuration }} --no-restore

    - name: Publish application
      run: dotnet publish GraceAI.csproj --configuration ${{ matrix.configuration }} --output publish

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GraceAI-${{ matrix.configuration }}
        path: publish
